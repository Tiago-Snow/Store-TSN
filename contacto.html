<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos - TSN OmniTech & Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col justify-between">
    <header class="bg-gray-900/95 border-b border-gray-800 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}"
                class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">TSN
                OmniTech</a>
            <a href="{% url 'home' %}"
                class="text-xs bg-gray-800 px-3 py-2 rounded-xl text-gray-300 hover:text-white transition"><i
                    class="fa-solid fa-arrow-left mr-1"></i> Voltar à Loja</a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-12 max-w-xl flex-grow">
        <div class="bg-gray-900 border border-gray-800 rounded-3xl p-8 shadow-2xl">
            <h1 class="text-3xl font-bold mb-6 flex items-center gap-3"><i
                    class="fa-solid fa-headset text-blue-500"></i> Fale Connosco</h1>

            {% if messages %}
            {% for message in messages %}
            <div
                class="bg-emerald-600/20 border border-emerald-500 text-emerald-300 p-4 rounded-xl mb-6 text-xs font-medium">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">O seu Nome</label>
                    <input type="text" name="nome" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">O seu E-mail</label>
                    <input type="email" name="email" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-300 mb-1">Mensagem</label>
                    <textarea name="mensagem" rows="4" required
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-sm text-white focus:outline-none focus:border-blue-500"></textarea>
                </div>
                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-3 rounded-xl transition shadow-lg">Enviar
                    Mensagem</button>
            </form>

            <div class="mt-8 pt-6 border-t border-gray-800 text-xs text-gray-400 space-y-2">
                <p><i class="fa-solid fa-envelope text-blue-400 mr-2"></i> E-mail: contacto@tsnomnitech.com</p>
                <p><i class="fa-brands fa-whatsapp text-emerald-400 mr-2"></i> Suporte Operacional: WhatsApp Business
                    Integrado</p>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-xs text-gray-500">
        &copy; 2026 TSN OmniTech & Store. Todos os direitos reservados.
    </footer>
</body>

</html>
